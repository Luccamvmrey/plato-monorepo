name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Para no primeiro erro: sem isso, um build que falha deixava o PM2 reiniciar com o
            # dist antigo da API enquanto a web já ia nova (aconteceu no PR #30).
            set -e
            # A VPS tem 1 GB de RAM e o Node limita o heap a ~490 MB: o tsc da API estourou.
            # O swap de 2,4 GB cobre o excedente.
            export NODE_OPTIONS=--max-old-space-size=1280
            cd /var/www/plato
            git pull
            npm install
            npm run db:sync -w packages/database
            npm run build -w packages/shared
            cp -r packages/database/generated packages/database/dist/
            npm run build -w apps/api
            npm run build -w apps/web
            npm run build -w apps/mcp
            pm2 restart plato-api
            pm2 restart plato-mcp
